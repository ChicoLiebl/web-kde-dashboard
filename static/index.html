<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Desktops</title>
<style>
  :root {
    --bg: #0f1115; --card: #181b22; --line: #2a2f3a;
    --text: #e6e8ee; --muted: #8b93a5; --current: #dfe5f2;
    --working: #4c8dff; --waiting: #ffcc00; --waiting-bg: #3d3200; --unknown: #8b93a5;
    --gap: 10px; --blink: 1.2s;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.3 system-ui, -apple-system, "Noto Sans", sans-serif; }
  body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
  header { display: flex; align-items: center; gap: 14px; padding: 8px 12px 0; flex: none; flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; color: var(--muted); }
  .stat { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .conn { margin-left: auto; font-size: 12px; color: var(--muted); }
  .conn.off { color: #ff6b6b; }
  .fs { padding: 4px 10px; font-size: 13px; font-weight: 600; background: #232833; color: var(--muted); }

  /* Grid: columns/rows are set from JS so cards are as large as the screen allows. */
  main { flex: 1; min-height: 0; display: grid; gap: var(--gap); padding: var(--gap); }

  .desk { container-type: size; min-width: 0; min-height: 0; overflow: hidden;
    border-radius: 16px; cursor: pointer; transition: transform .08s; user-select: none; }
  .desk:active { transform: scale(.985); }
  .desk { background: var(--card); border: 2px solid var(--line);
    padding: clamp(8px, 3cqmin, 20px); display: flex; flex-direction: column; gap: clamp(6px, 2cqmin, 14px); }
  .desk.working { border-color: var(--working); }
  .desk.current { border-color: var(--current); }
  .desk.waiting { border-color: var(--waiting); background: var(--waiting-bg); }
  .desk.waiting.blink { animation: blink var(--blink) ease-in-out infinite; }
  @keyframes blink {
    0%, 100% { background: var(--waiting-bg); border-color: var(--waiting); }
    50% { background: var(--card); border-color: #6b5600; }
  }

  .desk-head { display: flex; align-items: center; gap: .5em; font-size: clamp(16px, 11cqmin, 80px); }
  .desk-num { font-weight: 800; color: var(--muted); line-height: 1; }
  .current .desk-num { color: var(--current); }
  .waiting .desk-num { color: var(--waiting); }
  .desk-name { font-weight: 600; font-size: .45em; color: var(--muted);
    flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .here { font-size: .28em; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
    color: var(--bg); background: var(--current); padding: .2em .6em; border-radius: 99px; }

  /* Sessions share the card's height; each sizes its crab and text from its own box. */
  .claudes { display: flex; flex-direction: column; gap: clamp(4px, 1.5cqmin, 10px); min-height: 0; flex: 1; }
  .claude { background: rgba(0,0,0,.28); border-radius: 10px; border-left: 5px solid var(--unknown);
    flex: 1 1 0; min-height: 0; container-type: size; overflow: hidden; }
  .cbox { height: 100%; display: flex; align-items: center; gap: clamp(6px, 3cqw, 16px);
    padding: clamp(4px, 5cqh, 14px) clamp(6px, 3cqw, 16px); }
  .cinfo { flex: 1; min-width: 0; }
  /* The crab: a sprite sheet stepped through by CSS (see crabs.js). */
  .crab { flex: none; width: min(34cqw, 128cqh); aspect-ratio: 28 / 18; overflow: hidden; }
  .crab img { display: block; height: 100%; width: calc(var(--n) * 100%); max-width: none;
    image-rendering: pixelated; animation: crab-frames 1s steps(var(--n)) infinite; }
  @keyframes crab-frames { to { transform: translateX(-100%); } }
  /* Tall, narrow session boxes: crab on top, text under it. */
  @container (max-aspect-ratio: 4 / 3) {
    .cbox { flex-direction: column; justify-content: center; align-items: stretch; text-align: center; }
    .cbox .crab { width: min(86cqw, 66cqh); align-self: center; }
    .cbox .claude-top { justify-content: center; }
  }
  .claude.working { border-left-color: var(--working); }
  .claude.done, .claude.blocked { border-left-color: var(--waiting); }
  .claude.snoozed { opacity: .6; }
  .claude-top { display: flex; align-items: center; gap: .5em; font-size: clamp(14px, min(17cqh, 7cqw), 52px); }
  .project { font-weight: 700; font-family: ui-monospace, "JetBrains Mono", monospace;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .pill { font-family: system-ui, sans-serif; font-size: .4em; font-weight: 800; text-transform: uppercase;
    letter-spacing: .05em; padding: .25em .7em; border-radius: 99px; color: #111; background: var(--unknown); flex: none; }
  .working .pill { background: var(--working); color: #fff; }
  .done .pill, .blocked .pill { background: var(--waiting); }
  .blocked .pill { outline: 2px solid var(--waiting); outline-offset: 2px; }
  .snoozed .pill { background: #3a404d; color: var(--muted); }
  /* In cards the status sits on its own line, about as big as the project name. */
  .cstatus { font-size: clamp(15px, 7.5cqmin, 52px); margin-top: .15em; line-height: 1.15; }
  .cstatus .pill { display: inline-block; font-size: .8em; letter-spacing: .04em;
    padding: .1em .55em; border-radius: .35em; outline-width: .12em; outline-offset: .12em; }
  .ctitle { color: #b9c0cf; font-size: clamp(12px, min(11cqh, 4.6cqw), 30px); margin-top: .2em;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .ctitle:empty { display: none; }

  .apps { display: flex; flex-wrap: wrap; gap: .4em; font-size: clamp(11px, 4cqmin, 24px); margin-top: auto; }
  .app { background: #232833; color: #c3c8d4; padding: .25em .6em; border-radius: 6px;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .app b { font-weight: 600; color: var(--text); }
  .app.active { outline: 1px solid var(--current); }

  /* "New desktop": a slim bar under the grid, so the cards keep the space. */
  .newbar { flex: none; margin: 0 var(--gap) var(--gap); padding: 8px 14px; border: 2px dashed var(--line);
    background: transparent; color: var(--muted); border-radius: 12px; display: flex; align-items: center;
    justify-content: center; gap: 10px; font-size: 15px; }
  .newbar:active { transform: scale(.995); }
  .newbar .plus { font-size: 22px; line-height: 1; font-weight: 300; }
  .newbar .sub { font-size: 13px; font-weight: 500; opacity: .8; }

  /* Dynamic tiles: rows of cards whose widths follow their number of sessions (set from JS). */
  main.dyn { display: flex; flex-direction: column; }
  .drow { display: flex; gap: var(--gap); flex: 1 1 0; min-height: 0; }
  .drow > .desk { flex-basis: 0; }
  main.dyn .claudes { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); flex: 1; min-height: 0; }

  /* #crabs: every crab, for reviewing the art */
  .crab-page { position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow: auto; padding: 16px; }
  .crab-page h2 { margin: 0 0 12px; font-size: 18px; }
  .crab-gallery { border-spacing: 10px; }
  .crab-gallery th { color: var(--muted); font-weight: 600; font-size: 13px; text-align: left; vertical-align: bottom; }
  .crab-gallery small { display: block; font-weight: 400; font-size: 11px; }
  .crab-gallery td { background: var(--card); border-radius: 10px; padding: 8px; vertical-align: top; }
  .crab-gallery .crab { width: 112px; }

  .msg { margin: auto; color: var(--muted); text-align: center; padding: 16px; }

  /* Long-press sheet */
  .desk { -webkit-touch-callout: none; }
  .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none;
    align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .backdrop.open { display: flex; }
  .sheet { background: #1c2029; border: 1px solid var(--line); border-radius: 16px; padding: 18px;
    width: min(560px, 100%); max-height: 100%; overflow: auto; display: flex; flex-direction: column; gap: 12px; }
  .sheet h2 { margin: 0; font-size: 20px; }
  .sheet .row { display: flex; align-items: center; gap: 12px; background: rgba(0,0,0,.25);
    border-radius: 10px; padding: 10px 12px; border-left: 5px solid var(--unknown); }
  .sheet .row.working { border-left-color: var(--working); }
  .sheet .row.done, .sheet .row.blocked { border-left-color: var(--waiting); }
  .sheet .who { flex: 1; min-width: 0; }
  .sheet .who b { font-family: ui-monospace, "JetBrains Mono", monospace; font-size: 16px; }
  .sheet .who div { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sheet .pill { font-size: 11px; }
  .sheet .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
  button { font: inherit; font-weight: 600; font-size: 15px; border: 0; border-radius: 10px;
    padding: 10px 16px; background: #2c3240; color: var(--text); cursor: pointer; }
  button.primary { background: var(--waiting); color: #111; }
  .sheet .none { color: var(--muted); }
  button:disabled { opacity: .5; cursor: default; }

  /* New-desktop launcher and session settings */
  .sheet.wide { width: min(760px, 100%); }
  .field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
  select { font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 10px; width: 100%;
    background: #11141a; color: var(--text); border: 1px solid var(--line); }
  .hint { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; }
  .error { color: #ff6b6b; font-size: 14px; }
  .error:empty { display: none; }
  .check { display: flex; gap: 10px; align-items: center; font-size: 14px; }
  .check input { width: 20px; height: 20px; }
  .sortbar { display: flex; gap: 6px; }
  .chip { padding: 5px 12px; font-size: 13px; border-radius: 99px; background: #232833; color: var(--muted); }
  .chip.on { background: var(--current); color: var(--bg); }
  .slist { display: flex; flex-direction: column; gap: 6px; max-height: min(46vh, 440px); overflow-y: auto;
    overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 2px; margin: 0 -2px;
    scrollbar-color: #3a404d transparent;
    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding-block: 8px; }
  .sitem { text-align: left; font-weight: 400; padding: 10px 12px; background: rgba(0,0,0,.25);
    border: 2px solid transparent; flex: none; }
  .sitem.sel { border-color: var(--waiting); background: #2a2610; }
  .sitem:disabled { opacity: .55; }
  .gone { color: #ff6b6b; }
  .sitem .top { display: flex; align-items: baseline; gap: 8px; }
  .sitem b { font-family: ui-monospace, "JetBrains Mono", monospace; font-size: 15px; flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sitem .dbadge { font-size: 12px; color: var(--muted); flex: none; }
  .sitem .sub { color: var(--muted); font-size: 13px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .srow { display: flex; align-items: center; gap: 12px; background: rgba(0,0,0,.25); border-radius: 10px; padding: 10px 12px; }
  .srow .who { flex: 1; min-width: 0; }
  .srow .who b { font-family: ui-monospace, "JetBrains Mono", monospace; font-size: 15px; }
  .srow .who div { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .srow select { width: 170px; flex: none; }
  .srow .ok { width: 1.2em; color: #3ecf8e; flex: none; }
  .tintbox { display: flex; flex-direction: column; gap: 8px; background: rgba(0,0,0,.25); border-radius: 10px; padding: 10px 12px; }
  .swatches { display: flex; flex-wrap: wrap; gap: 6px; }
  .swatch { font: 12px ui-monospace, "JetBrains Mono", monospace; background: #1d2021; padding: 4px 9px; border-radius: 6px; border: 1px solid; filter: brightness(1.6); }
  .tintbox.off .swatches { opacity: .35; }
  .tintbox .ok { color: #3ecf8e; }
  .srow .running { font-size: 10px; font-weight: 800; text-transform: uppercase; color: var(--working); margin-left: 6px; }

  /* Tabs */
  [hidden] { display: none !important; }
  /* Horizontal swipes switch tabs: the page handles them (pan-y leaves vertical scrolling to the
     browser), and Chrome's swipe-to-go-back is off. */
  html, body { overscroll-behavior-x: none; }
  main { touch-action: pan-y; }
  main.snap { transition: transform .2s ease-out, opacity .2s ease-out; }
  @keyframes in-left { from { transform: translateX(-35%); opacity: 0; } }
  @keyframes in-right { from { transform: translateX(35%); opacity: 0; } }
  main.in-left { animation: in-left .22s ease-out; }
  main.in-right { animation: in-right .22s ease-out; }
  .tabs { display: flex; background: #181b22; border-radius: 10px; padding: 3px; gap: 2px; }
  .tabs button { padding: 5px 14px; font-size: 14px; background: transparent; color: var(--muted); border-radius: 8px; }
  .tabs button.on { background: #2c3240; color: var(--text); }
  .tabs .count { display: inline-block; min-width: 1.6em; padding: 0 .4em; margin-left: 6px; border-radius: 99px;
    font-size: 12px; background: #3a404d; color: var(--text); }
  .tabs .count:empty { display: none; }

  /* Tasks tab */
  #tasks { display: block; overflow-y: auto; overscroll-behavior: contain; padding: var(--gap) calc(var(--gap) + 2px); }
  .tbar { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin: 2px 2px 12px; }
  .tbar h2 { margin: 0; font-size: 22px; }
  .tbar .hint { flex: 1; }
  .tbar button { padding: 6px 12px; font-size: 13px; }
  .tcols { columns: 340px; column-gap: 14px; }
  .tsec { margin-bottom: 16px; }  /* may continue in the next column, between tasks */
  .tsec h3 { break-after: avoid; margin: 0 2px 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted);
    display: flex; gap: 8px; align-items: center; }
  .tsec h3 .n { background: #2c3240; color: var(--text); border-radius: 99px; padding: 0 .55em; font-size: 12px; }
  .tsec.overdue h3 { color: #ff6b6b; }
  .tsec.due h3 { color: var(--waiting); }
  .tsec.doing h3 { color: var(--working); }
  .task { break-inside: avoid; background: var(--card); border: 1px solid var(--line); border-left: 6px solid var(--pc);
    border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; user-select: none; display: block;
    width: 100%; text-align: left; font-weight: 400; }
  .task:active { transform: scale(.99); }
  .task.done { opacity: .55; }
  .task.done .ttitle { text-decoration: line-through; }
  .ttop { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .ttop .tkey { font-family: ui-monospace, "JetBrains Mono", monospace; font-weight: 700; }
  .ttop .tproj { margin-left: auto; color: var(--pc); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ttitle { font-size: 17px; font-weight: 600; margin: 4px 0 6px; line-height: 1.25;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .tmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .tag { padding: 2px 8px; border-radius: 99px; background: #232833; font-weight: 600; }
  .tag.doing { background: var(--working); color: #fff; }
  .tag.blocked { background: #ff6b6b; color: #111; }
  .tag.late { background: #4a1d1d; color: #ff9b9b; }
  .tag.soon { background: var(--waiting-bg); color: var(--waiting); }
  .prio { font-weight: 800; letter-spacing: -.05em; }
  .prio.p4 { color: #ff6b6b; } .prio.p3 { color: #ff9f43; } .prio.p2 { color: var(--waiting); } .prio.p1 { color: var(--muted); }
  .tprog { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; }
  .tprog i { display: block; width: 56px; height: 6px; border-radius: 3px; background: #2c3240; overflow: hidden; }
  .tprog i b { display: block; height: 100%; background: #3ecf8e; }
  .tempty { color: var(--muted); text-align: center; padding: 40px 16px; font-size: 18px; }
  .clist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .clist li { display: flex; gap: 8px; font-size: 14px; }
  .clist li.ok { color: var(--muted); text-decoration: line-through; }
  .desc { white-space: pre-wrap; font-size: 13px; color: #b9c0cf; max-height: 30vh; overflow-y: auto;
    background: rgba(0,0,0,.25); border-radius: 10px; padding: 10px 12px; }
</style>
</head>
<body>
<header>
  <h1 id="host">Desktops</h1>
  <nav class="tabs">
    <button data-tab="desks" class="on">Desktops</button>
    <button data-tab="tasks">Tasks<span class="count" id="n-tasks"></span></button>
  </nav>
  <span class="stat"><span class="dot" style="background:var(--waiting)"></span><span id="n-idle">0</span> waiting</span>
  <span class="stat"><span class="dot" style="background:var(--working)"></span><span id="n-working">0</span> working</span>
  <span class="conn off" id="conn">connecting…</span>
  <button class="fs" id="tiles" title="Even: all cards the same size. Dynamic: cards with more sessions get wider.">▦ Even</button>
  <button class="fs" id="cfg">⚙ Sessions</button>
  <button class="fs" id="fs" hidden>⛶ Fullscreen</button>
  <button class="fs" id="sleep" hidden title="Turn this tablet's screen off">☾ Sleep</button>
</header>
<main id="grid"><div class="msg">Waiting for KWin…</div></main>
<button class="newbar" id="newdesk"><span class="plus">+</span>New desktop<span class="sub" id="newdesk-sub"></span></button>
<main id="tasks" hidden><div class="tempty">Loading tasks…</div></main>
<div class="backdrop" id="backdrop"><div class="sheet" id="sheet"></div></div>
<div class="backdrop" id="modal-backdrop"><div class="sheet" id="modal"></div></div>
<script src="crabs.js"></script>
<script>
// Token: from ?t= on first open, then remembered so the home-screen shortcut keeps working.
let token = new URLSearchParams(location.search).get("t");
// ?view=panel: shown in the KDE panel widget (plasmoid/), which has no use for fullscreen or tablet sleep.
const PANEL = new URLSearchParams(location.search).get("view") === "panel";
if (PANEL) document.documentElement.classList.add("panel");
try { if (token) localStorage.setItem("kddash-token", token); else token = localStorage.getItem("kddash-token"); } catch {}

const grid = document.getElementById("grid");
const conn = document.getElementById("conn");
const BLINK_MS = 1200;
const ASPECT = 1.35;  // preferred card width/height when choosing the grid shape
const UNIT_ASPECT = 0.9;  // dynamic tiles: preferred width/height of one session column

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const label = { working: "working", blocked: "needs you", done: "waiting", unknown: "claude", snoozed: "idle" };
const LONG_PRESS_MS = 500;
let last = null;      // latest state from the server
let sheetDesk = null; // desktop id whose long-press sheet is open

const isAlert = c => !c.snoozed && (c.status === "done" || c.status === "blocked");
const cstate = c => c.snoozed ? "snoozed" : c.status;
const sessionsOn = (s, deskId) => s.windows.filter(w => w.claude && w.desktops.includes(deskId))
  .flatMap(w => w.claude.map(c => ({ ...c, window: w })));

function api(path, params) {
  fetch(`api/${path}?t=${encodeURIComponent(token)}&${new URLSearchParams(params)}`, { method: "POST" });
  if (navigator.vibrate) navigator.vibrate(15);
}
const post = params => api("activate", params);
const snooze = (pid, on) => api("snooze", { pid, on: on ? 1 : 0 });

// Tile mode: "even" (same-size cards in a grid) or "dynamic" (widths follow content), per device.
let tileMode = "even";
try { if (localStorage.getItem("kddash-tiles") === "dynamic") tileMode = "dynamic"; } catch {}
const tilesBtn = document.getElementById("tiles");
const showTileMode = () => { tilesBtn.textContent = tileMode === "dynamic" ? "▦ Dynamic" : "▦ Even"; };
showTileMode();
tilesBtn.addEventListener("click", () => {
  tileMode = tileMode === "dynamic" ? "even" : "dynamic";
  try { localStorage.setItem("kddash-tiles", tileMode); } catch {}
  showTileMode();
  if (last) render(last);
});

function gridBox() {
  const gap = parseFloat(getComputedStyle(grid).gap) || 0;
  return { gap, W: grid.clientWidth - 2 * gap, H: grid.clientHeight - 2 * gap };
}

// Dynamic tiles: split the cards, in order, into rows. Within a row each card's width is proportional
// to its weight (one unit per Claude session, side by side inside the card; less for app-only cards).
// Tries every row count and keeps the one whose smallest unit is biggest (units want UNIT_ASPECT w:h).
function dynamicRows(weights) {
  const n = weights.length, { gap, W, H } = gridBox();
  let best = null;
  for (let r = 1; r <= n; r++) {
    const rows = partition(weights, r);
    const h = (H - (r - 1) * gap) / r;
    const score = Math.min(...rows.map(row => {
      const total = row.reduce((a, i) => a + weights[i], 0);
      return Math.min((W - (row.length - 1) * gap) / total / UNIT_ASPECT, h);
    }));
    if (!best || score > best.score + 0.5) best = { score, rows };
  }
  return best.rows;
}
// Contiguous split of 0..n-1 into r rows with the smallest possible heaviest row (n is small).
function partition(weights, r) {
  const n = weights.length, pre = [0];
  weights.forEach(w => pre.push(pre.at(-1) + w));
  const cost = Array.from({ length: r + 1 }, () => Array(n + 1).fill(Infinity)), cut = cost.map(a => a.map(() => 0));
  cost[0][0] = 0;
  for (let k = 1; k <= r; k++)
    for (let i = k; i <= n; i++)
      for (let j = k - 1; j < i; j++) {
        const c = Math.max(cost[k - 1][j], pre[i] - pre[j]);
        if (c < cost[k][i]) { cost[k][i] = c; cut[k][i] = j; }
      }
  const rows = [];
  for (let k = r, i = n; k > 0; i = cut[k][i], k--) rows.unshift([...Array(i - cut[k][i]).keys()].map(x => x + cut[k][i]));
  return rows;
}

// Even tiles: pick the column count that gives the biggest cards for n tiles in the available area.
function layout() {
  if (tileMode === "dynamic") return;
  const n = grid.querySelectorAll(".desk").length;
  if (!n) { grid.style.gridTemplateColumns = grid.style.gridTemplateRows = ""; return; }
  const { gap, W, H } = gridBox();
  let best = { score: -1, cols: 1, rows: n };
  for (let cols = 1; cols <= n; cols++) {
    const rows = Math.ceil(n / cols);
    const cw = (W - (cols - 1) * gap) / cols, ch = (H - (rows - 1) * gap) / rows;
    const score = Math.min(cw / ASPECT, ch);
    if (score > best.score) best = { score, cols, rows };
  }
  grid.style.gridTemplateColumns = `repeat(${best.cols}, minmax(0, 1fr))`;
  grid.style.gridTemplateRows = `repeat(${best.rows}, minmax(0, 1fr))`;
}
let lastBox = "";
new ResizeObserver(() => {
  const box = `${grid.clientWidth}x${grid.clientHeight}`;
  if (box === lastBox) return;
  lastBox = box;
  if (tileMode === "dynamic" && last && !grid.hidden) render(last);
  else layout();
}).observe(grid);

function subtitle(c) {
  return c.status === "blocked" && c.waitingFor ? `⚠ ${c.waitingFor} · ${c.title}` : c.title;
}

// First empty desktop after the current one, wrapping around: {id, name, number} or undefined.
function nextEmpty(s) {
  const cur = s.desktops.findIndex(d => d.id === s.current);
  for (let k = 1; k <= s.desktops.length; k++) {
    const i = (cur + k) % s.desktops.length, d = s.desktops[i];
    if (!s.windows.some(w => w.desktops.includes(d.id))) return { ...d, number: i + 1 };
  }
}

function render(s) {
  last = s;
  document.getElementById("host").textContent = s.host || "Desktops";
  if (!s.desktops?.length) return;
  let working = 0, waiting = 0;
  const curIdx = s.desktops.findIndex(d => d.id === s.current);
  // Keep the blink phase continuous across re-renders (updates arrive several times a second).
  const phase = `animation-delay:-${Date.now() % BLINK_MS}ms`;

  trackStatus(s);
  const weights = [];
  const cards = s.desktops.map((d, i) => {
    const wins = s.windows.filter(w => w.desktops.includes(d.id));
    if (!wins.length) return "";
    const claudes = sessionsOn(s, d.id), others = wins.filter(w => !w.claude);
    const alerts = claudes.filter(isAlert);
    working += claudes.filter(c => c.status === "working").length;
    waiting += alerts.length;
    // Blink until you look at it: a waiting session whose window is focused stays solid yellow.
    const blink = alerts.some(c => !c.window.active);
    const cls = ["desk",
      d.id === s.current && "current",
      claudes.some(c => c.status === "working") && "working",
      alerts.length && "waiting", blink && "blink"].filter(Boolean).join(" ");
    const sessions = claudes.map(c => `
      <div class="claude ${cstate(c)}" data-window="${esc(c.window.id)}"><div class="cbox">
        ${crab(c)}
        <div class="cinfo">
          <div class="claude-top"><span class="project">${esc(c.project)}</span></div>
          <div class="ctitle">${esc(subtitle(c))}</div>
        </div>
      </div></div>`).join("");
    const apps = others.map(w =>
      `<span class="app${w.active ? " active" : ""}" data-window="${esc(w.id)}" title="${esc(w.caption)}"><b>${esc(w.cls)}</b> ${esc(w.caption)}</span>`).join("");
    const weight = claudes.length || 0.6;  // app-only cards: narrower
    weights.push(weight);
    return `<section class="${cls}" data-desktop="${esc(d.id)}" style="flex-grow:${weight};${blink ? phase : ""}">
      <div class="desk-head"><span class="desk-num">${i + 1}</span><span class="desk-name">${esc(d.name)}</span>
        ${d.id === s.current ? `<span class="here">here</span>` : ""}</div>
      ${sessions ? `<div class="claudes">${sessions}</div>` : ""}
      ${apps ? `<div class="apps">${apps}</div>` : ""}
    </section>`;
  }).filter(Boolean);

  // "New desktop" bar: opens the launcher; its default desktop is the next empty one.
  const empty = nextEmpty(s);
  document.getElementById("newdesk-sub").textContent = empty ? `next empty: ${empty.number} · ${empty.name}` : "no empty desktop";

  const dynamic = tileMode === "dynamic" && cards.length > 0;
  grid.classList.toggle("dyn", dynamic);
  if (dynamic) {
    grid.style.gridTemplateColumns = grid.style.gridTemplateRows = "";
    grid.innerHTML = dynamicRows(weights).map(row => `<div class="drow">${row.map(i => cards[i]).join("")}</div>`).join("");
  } else {
    grid.innerHTML = cards.join("");
    layout();
  }
  switchOnStatusChange(s);
  document.getElementById("n-working").textContent = working;
  document.getElementById("n-idle").textContent = waiting;
  document.title = waiting ? `(${waiting}) Desktops` : "Desktops";
  if (sheetDesk) renderSheet();
}

// ---- crabs: each session's pose (what it's doing) and hat (its kind of work), see crabs.js

const CELEBRATE_MS = 6000;  // a session that just finished hops with its flag for this long
const ACTIVITY_POSE = { read: "read", write: "work", bash: "work", web: "web", plan: "plan",
  delegate: "delegate", think: "think", run: "run" };
const ACTIVITY_LABEL = { read: "reading", write: "editing", bash: "running commands", web: "on the web",
  plan: "planning", delegate: "running subagents", think: "thinking", run: "using a tool" };
const statusSince = new Map();  // pid -> {status, at}; at = 0 when it was already so on page load
let celebrateTimer = null;

function trackStatus(s) {
  const now = Date.now(), seen = new Set();
  for (const w of s.windows) for (const c of w.claude || []) {
    seen.add(c.pid);
    const prev = statusSince.get(c.pid);
    if (!prev || prev.status !== c.status) statusSince.set(c.pid, { status: c.status, at: prev ? now : 0 });
  }
  for (const pid of statusSince.keys()) if (!seen.has(pid)) statusSince.delete(pid);
}

function crabPose(c) {
  if (c.snoozed) return "sleep";
  if (c.status === "working") return ACTIVITY_POSE[c.activity] || "run";
  if (c.status === "blocked") return "ask";
  if (c.status === "done") {
    const since = statusSince.get(c.pid)?.at;
    return since && Date.now() - since < CELEBRATE_MS ? "celebrate" : "done";
  }
  return "idle";
}

function crab(c) {
  const pose = crabPose(c);
  if (pose === "celebrate" && !celebrateTimer) {  // come back to settle it down when the hop is over
    const left = CELEBRATE_MS - (Date.now() - statusSince.get(c.pid).at);
    celebrateTimer = setTimeout(() => { celebrateTimer = null; if (last) render(last); }, left + 50);
  }
  const doing = c.status === "working" && ACTIVITY_LABEL[c.activity];
  return CRAB.html(c.kind, pose, {
    mark: /permission|approv|allow/i.test(c.waitingFor || "") ? "!" : "?",
    title: [label[cstate(c)], doing, c.kind].filter(Boolean).join(" · "),
  });
}

// When a Claude session changes status (e.g. finishes its turn, or asks for permission) while the
// Tasks tab is showing, slide back to Desktops. New and closed sessions, and idle marks, don't count.
let lastStatus = null;
function switchOnStatusChange(s) {
  const now = new Map(s.windows.flatMap(w => (w.claude || []).map(c => [c.pid, c.status])));
  const changed = lastStatus && [...now].some(([pid, st]) => lastStatus.has(pid) && lastStatus.get(pid) !== st);
  lastStatus = now;
  if (changed && currentTab === "tasks") showTab("desks", "left");
}

// ---- long-press sheet: mark sessions idle so they stop alerting until their next turn

const backdrop = document.getElementById("backdrop"), sheet = document.getElementById("sheet");

function renderSheet() {
  const s = last, i = s.desktops.findIndex(d => d.id === sheetDesk);
  if (i < 0) return closeSheet();
  const claudes = sessionsOn(s, sheetDesk);
  const alerting = claudes.filter(isAlert);
  const rows = claudes.map(c => {
    const btn = c.snoozed ? `<button data-snooze="${c.pid}" data-on="0">Unmark</button>`
      : isAlert(c) ? `<button class="primary" data-snooze="${c.pid}" data-on="1">Mark idle</button>` : "";
    return `<div class="row ${cstate(c)}"><div class="who"><b>${esc(c.project)}</b> <span class="pill">${label[cstate(c)]}</span>
      <div>${esc(subtitle(c))}</div></div>${btn}</div>`;
  }).join("");
  sheet.innerHTML = `<h2>${i + 1} · ${esc(s.desktops[i].name)}</h2>
    ${rows || `<div class="none">No Claude sessions on this desktop.</div>`}
    <div class="actions">
      ${alerting.length > 1 ? `<button class="primary" data-snooze-all>Mark all idle</button>` : ""}
      <button data-launch>Open Claude session here</button>
      <button data-go>Go to desktop</button><button data-close>Close</button>
    </div>`;
}

function openSheet(deskId) { sheetDesk = deskId; renderSheet(); backdrop.classList.add("open"); }
function closeSheet() { sheetDesk = null; backdrop.classList.remove("open"); }

backdrop.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (e.target === backdrop || b?.dataset.close !== undefined) return closeSheet();
  if (!b) return;
  if (b.dataset.snooze) return snooze(b.dataset.snooze, b.dataset.on === "1");
  if (b.dataset.snoozeAll !== undefined) return sessionsOn(last, sheetDesk).filter(isAlert).forEach(c => snooze(c.pid, true));
  if (b.dataset.go !== undefined) { post({ desktop: sheetDesk }); closeSheet(); }
  if (b.dataset.launch !== undefined) {
    const n = last.desktops.findIndex(d => d.id === sheetDesk) + 1;
    closeSheet();
    openLauncher(n);
  }
});

// Taps and long-presses are resolved from the element under the finger at pointerdown:
// the grid re-renders several times a second, so a plain "click" can land on a replaced node.
let press = null;
grid.addEventListener("pointerdown", e => {
  if (e.button !== 0) return;
  const target = e.target.closest("[data-desktop]");
  if (!target) return;
  const win = e.target.closest("[data-window]");
  press = { x: e.clientX, y: e.clientY, desktop: target.dataset.desktop, window: win?.dataset.window, timer: null };
  if (target.classList.contains("desk")) {
    const p = press;
    p.timer = setTimeout(() => {
      p.timer = null; p.long = true;
      if (navigator.vibrate) navigator.vibrate(30);
      openSheet(p.desktop);
    }, LONG_PRESS_MS);
  }
});
grid.addEventListener("pointermove", e => {
  if (press && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 10) { clearTimeout(press.timer); press = null; }
});
grid.addEventListener("pointercancel", () => { if (press) clearTimeout(press.timer); press = null; });
grid.addEventListener("pointerup", () => {
  if (!press) return;
  const p = press; press = null;
  clearTimeout(p.timer);
  if (p.long) return;
  post(p.window ? { window: p.window } : { desktop: p.desktop });
});
grid.addEventListener("contextmenu", e => {  // right-click on desktop; also blocks Android's long-press menu
  e.preventDefault();
  const desk = e.target.closest(".desk");
  if (desk && !sheetDesk) openSheet(desk.dataset.desktop);
});

// ---- modal: "New desktop" launcher and session desktop settings (not re-rendered by live updates)

const modalBackdrop = document.getElementById("modal-backdrop"), modal = document.getElementById("modal");
const openModal = (html, wide) => { modal.className = "sheet" + (wide ? " wide" : ""); modal.innerHTML = html; modalBackdrop.classList.add("open"); };
const closeModal = () => modalBackdrop.classList.remove("open");
modalBackdrop.addEventListener("click", e => {
  if (e.target === modalBackdrop || e.target.closest("[data-close]")) closeModal();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeModal(); closeSheet(); } });

async function call(path, params = {}, method = "GET") {
  const r = await fetch(`api/${path}?t=${encodeURIComponent(token)}&${new URLSearchParams(params)}`, { method });
  const body = r.status === 204 ? {} : await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.error || `${r.status} ${r.statusText}`);
  return body;
}

function ago(ts) {
  if (!ts) return "never opened";
  const sec = Date.now() / 1000 - ts;
  for (const [u, n] of [["d", 86400], ["h", 3600], ["m", 60]]) if (sec >= n) return `${Math.floor(sec / n)}${u} ago`;
  return "just now";
}

// `fixedDesktop` (1-based): opened from a desktop's long-press popup, so the session opens there
// and choosing a session doesn't move the desktop to the session's saved one.
async function openLauncher(fixedDesktop) {
  const heading = fixedDesktop ? `Claude session on desktop ${fixedDesktop}` : "New desktop";
  openModal(`<h2>${heading}</h2><div class="hint">Loading sessions…</div>`);
  let data;
  try { data = await call("sessions"); }
  catch (err) { return openModal(`<h2>${heading}</h2><div class="error">${esc(err.message)}</div>
    <div class="actions"><button data-close>Close</button></div>`); }
  const sessions = data.sessions.filter(x => !x.running);
  const empty = fixedDesktop ? null : nextEmpty(last);
  const fallback = fixedDesktop || (empty ? empty.number : (last.desktops.findIndex(d => d.id === last.current) + 1));
  const deskLabel = d => `${d.number} · ${d.name}${d.empty ? " (empty)" : d.tab ? " (kitty: new tab)" : ""}`;

  openModal(`<h2>${heading}</h2>
    <div class="field">Claude session
      <div class="sortbar"><button class="chip on" data-sort="used">Most used</button><button class="chip" data-sort="recent">Recent</button></div></div>
    <div class="slist" id="l-list" role="listbox"></div>
    <div class="hint" id="l-info"></div>
    <label class="field">Desktop
      <select id="l-desktop">${data.desktops.map(d => `<option value="${d.number}">${esc(deskLabel(d))}</option>`).join("")}</select></label>
    <div class="hint" id="l-how"></div>
    <label class="check" id="l-remember-row" hidden><input type="checkbox" id="l-remember"><span id="l-remember-text"></span></label>
    <div class="error" id="l-error"></div>
    <div class="actions">
      ${empty ? `<button id="l-goto">Just go to desktop ${empty.number}</button>` : ""}
      <button data-close>Cancel</button>
      <button class="primary" id="l-launch" disabled>Launch</button>
    </div>`);

  const $ = id => document.getElementById(id);
  const desk = $("l-desktop"), list = $("l-list");
  desk.value = fallback;
  let selected = null, sort = "used";
  const current = () => sessions.find(x => x.key === selected);

  // Server order is "most used" (prompts you sent, recent ones weighted more); "recent" = last prompt.
  function renderList() {
    const rows = sort === "recent" ? [...sessions].sort((a, b) => b.last_used - a.last_used) : sessions;
    list.innerHTML = rows.map(x => `<button class="sitem${x.key === selected ? " sel" : ""}" data-key="${esc(x.key)}" role="option"${x.missing ? " disabled" : ""}>
        <div class="top"><b>${esc(x.name)}</b>${x.desktop ? `<span class="dbadge">desktop ${x.desktop}</span>` : ""}</div>
        <div class="sub">${x.missing ? `<span class="gone">folder not found:</span> ` : ""}${esc(x.short_cwd)} · ${x.prompts} prompt${x.prompts === 1 ? "" : "s"} · used ${ago(x.last_used)}</div>
      </button>`).join("") || `<div class="none">No named sessions that aren't running.</div>`;
  }
  list.addEventListener("click", e => {
    const item = e.target.closest(".sitem");
    if (!item) return;
    selected = item.dataset.key;
    list.querySelectorAll(".sitem").forEach(el => el.classList.toggle("sel", el === item));
    const x = current();
    if (!fixedDesktop) desk.value = x.desktop && x.desktop <= data.desktops.length ? x.desktop : fallback;
    $("l-remember").checked = !x.desktop;  // first launch: remember the choice by default
    update();
  });
  modal.querySelector(".sortbar").addEventListener("click", e => {
    const chip = e.target.closest(".chip");
    if (!chip) return;
    sort = chip.dataset.sort;
    modal.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c === chip));
    renderList();
    list.scrollTop = 0;
  });
  renderList();

  function update() {
    const x = current(), n = +desk.value, d = data.desktops[n - 1];
    $("l-info").textContent = x?.title && x.title !== x.name ? x.title : "";
    $("l-how").textContent = d.tab ? "Opens as a new tab in the kitty window on that desktop."
      : d.kitty ? "The kitty there has remote control off, so this opens a new kitty window (see README)."
      : "Opens a new kitty window, tiled to the right.";
    $("l-remember-row").hidden = !x || x.desktop === n;
    $("l-remember-text").textContent = x?.desktop ? `Change this session's saved desktop from ${x.desktop} to ${n}` : `Save desktop ${n} for this session`;
    $("l-launch").disabled = !x;
  }
  desk.addEventListener("change", update);
  update();

  $("l-goto")?.addEventListener("click", () => { post({ desktop: empty.id }); closeModal(); });
  $("l-launch").addEventListener("click", async () => {
    const btn = $("l-launch");
    btn.disabled = true; btn.textContent = "Opening…"; $("l-error").textContent = "";
    try {
      await call("launch", { key: selected, desktop: desk.value, remember: $("l-remember").checked && !$("l-remember-row").hidden ? 1 : 0 }, "POST");
      if (navigator.vibrate) navigator.vibrate(15);
      closeModal();
    } catch (err) {
      $("l-error").textContent = err.message; btn.disabled = false; btn.textContent = "Launch";
    }
  });
}

async function openSettings() {
  openModal(`<h2>Session desktops</h2><div class="hint">Loading…</div>`, true);
  let data, tint;
  try { [data, tint] = await Promise.all([call("sessions"), call("kitty-colors").catch(() => null)]); }
  catch (err) { return openModal(`<h2>Session desktops</h2><div class="error">${esc(err.message)}</div>
    <div class="actions"><button data-close>Close</button></div>`, true); }
  const options = sel => `<option value="0">— not set</option>` + data.desktops.map(d =>
    `<option value="${d.number}"${d.number === sel ? " selected" : ""}>${d.number} · ${esc(d.name)}</option>`).join("");
  const rows = data.sessions.map(x => `
    <div class="srow"><div class="who"><b>${esc(x.name)}</b>${x.running ? `<span class="running">running</span>` : ""}
      <div>${x.missing ? `<span class="gone">folder not found:</span> ` : ""}${esc(x.short_cwd)} · ${x.prompts} prompt${x.prompts === 1 ? "" : "s"} · used ${ago(x.last_used)}</div></div>
      <select data-key="${esc(x.key)}">${options(x.desktop)}</select><span class="ok"></span></div>`).join("");
  const KIND_NAMES = { software: "software", firmware: "firmware", pcb: "PCB", cad: "CAD" };
  const tintBox = tint ? `<div class="tintbox${tint.enabled ? "" : " off"}" id="s-tint">
      <label class="check"><input type="checkbox" id="s-tint-on"${tint.enabled ? " checked" : ""}><span><b>Kitty background pattern by kind</b>: on every kitty window with a Claude session</span><span class="ok"></span></label>
      <div class="swatches">${Object.entries(KIND_NAMES).filter(([k]) => tint.colors[k]).map(([k, n]) =>
        `<span class="swatch" style="color:${esc(tint.colors[k])};border-color:${esc(tint.colors[k])}">${n} · ${esc(tint.patterns?.[k] || "")}</span>`).join("")}</div></div>` : "";
  openModal(`<h2>Session desktops</h2>
    ${tintBox}
    <div class="hint">The desktop each named session opens on from <b>New desktop</b>. Stored in ~/.config/ccm/sessions.json, shared with the <code>ccm</code> command.</div>
    ${rows || `<div class="none">No named sessions yet. Name one with <code>claude -n NAME</code> or <code>/rename</code>.</div>`}
    <div class="error" id="s-error"></div>
    <div class="actions"><button class="primary" data-close>Done</button></div>`, true);
  document.getElementById("s-tint-on")?.addEventListener("change", async e => {
    const box = document.getElementById("s-tint"), ok = box.querySelector(".ok");
    ok.textContent = "…";
    try {
      const r = await call("kitty-colors", { enabled: e.target.checked ? 1 : 0 }, "POST");
      box.classList.toggle("off", !r.enabled); ok.textContent = "✓";
    } catch (err) { ok.textContent = "!"; document.getElementById("s-error").textContent = err.message; }
  });
  modal.querySelectorAll("select[data-key]").forEach(s => s.addEventListener("change", async () => {
    const ok = s.nextElementSibling;
    ok.textContent = "…";
    try { await call("sessions/desktop", { key: s.dataset.key, desktop: s.value }, "POST"); ok.textContent = "✓"; }
    catch (err) { ok.textContent = "!"; document.getElementById("s-error").textContent = err.message; }
  }));
}
document.getElementById("cfg").addEventListener("click", openSettings);

function connect() {
  if (!token) { grid.innerHTML = `<div class="msg">Open the URL printed by <code>kddash.py</code> (it includes ?t=…)</div>`; return; }
  const es = new EventSource(`events?t=${encodeURIComponent(token)}`);
  es.onopen = () => { conn.textContent = "live"; conn.classList.remove("off"); };
  es.onmessage = e => render(JSON.parse(e.data));
  es.onerror = () => { conn.textContent = "reconnecting…"; conn.classList.add("off"); };
}
// Fullscreen toggle (hidden where the Fullscreen API isn't available, e.g. iPhone Safari).
const fsBtn = document.getElementById("fs");
if (document.fullscreenEnabled && !PANEL) {
  fsBtn.hidden = false;
  fsBtn.addEventListener("click", () => document.fullscreenElement
    ? document.exitFullscreen()
    : document.documentElement.requestFullscreen({ navigationUI: "hide" }).catch(() => {}));
  document.addEventListener("fullscreenchange", () => {
    fsBtn.textContent = document.fullscreenElement ? "✕ Exit fullscreen" : "⛶ Fullscreen";
  });
}

document.getElementById("newdesk").addEventListener("click", () => openLauncher());

// ---- Tabs: Desktops | Tasks (remembered per device)
const tasksEl = document.getElementById("tasks");
const tabButtons = document.querySelectorAll(".tabs button");
const TABS = [...tabButtons].map(b => b.dataset.tab);  // left to right
const tabEl = tab => tab === "tasks" ? tasksEl : grid;
let currentTab = "desks";
function showTab(tab, from) {  // from: "left"/"right" = slide the new tab in from that side
  const el = tabEl(tab);
  if (from) {
    el.classList.remove("in-left", "in-right");
    void el.offsetWidth;  // restart the animation
    el.classList.add(`in-${from}`);
  }
  currentTab = tab;
  tabButtons.forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  grid.hidden = tab !== "desks";
  document.getElementById("newdesk").hidden = tilesBtn.hidden = tab !== "desks";
  tasksEl.hidden = tab !== "tasks";
  try { localStorage.setItem("kddash-tab", tab); } catch {}
  if (tab === "tasks") loadTasks();
  else layout();
}
tabButtons.forEach(b => b.addEventListener("click", () => {
  const step = TABS.indexOf(b.dataset.tab) - TABS.indexOf(currentTab);
  showTab(b.dataset.tab, step > 0 ? "right" : step < 0 ? "left" : null);
}));
[grid, tasksEl].forEach(el => el.addEventListener("animationend", () => el.classList.remove("in-left", "in-right")));

// Swipe left/right anywhere on the page body to change tabs. The current tab follows the finger;
// letting go past SWIPE_SHARE of the width, or a quick flick, switches. Touch events, not pointer
// events, because the browser cancels pointer events once it starts scrolling the Tasks list.
const SWIPE_SHARE = 0.2, FLICK_PX = 50, FLICK_MS = 250, LOCK_PX = 12;
let swipe = null;
document.addEventListener("touchstart", e => {
  const modalOpen = document.querySelector(".backdrop.open");
  swipe = e.touches.length === 1 && !modalOpen && e.target.closest("main")
    ? { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now(), axis: null, el: tabEl(currentTab) } : null;
}, { passive: true });
document.addEventListener("touchmove", e => {
  if (!swipe || e.touches.length !== 1) return;
  const dx = e.touches[0].clientX - swipe.x, dy = e.touches[0].clientY - swipe.y;
  if (!swipe.axis) {
    if (Math.hypot(dx, dy) < LOCK_PX) return;
    swipe.axis = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
    if (swipe.axis === "x") {
      swipe.el.classList.remove("snap");
      clearTimeout(press?.timer); press = null;  // not a tap or long-press on a desktop card
    }
  }
  if (swipe.axis !== "x") return;
  swipe.dx = dx;
  const target = TABS[TABS.indexOf(currentTab) + (dx < 0 ? 1 : -1)];
  const shown = target ? dx : dx * 0.25;  // resist where there's no tab to go to
  swipe.el.style.transform = `translateX(${shown}px)`;
  swipe.el.style.opacity = String(1 - Math.min(Math.abs(shown) / innerWidth, 1) * 0.6);
}, { passive: true });
function endSwipe() {
  if (!swipe || swipe.axis !== "x") { swipe = null; return; }
  const { el, dx = 0, t } = swipe;
  swipe = null;
  const target = TABS[TABS.indexOf(currentTab) + (dx < 0 ? 1 : -1)];
  const far = Math.abs(dx) > innerWidth * SWIPE_SHARE || (Math.abs(dx) > FLICK_PX && Date.now() - t < FLICK_MS);
  el.classList.add("snap");
  el.style.transform = el.style.opacity = "";
  if (target && far) {
    el.classList.remove("snap");
    showTab(target, dx < 0 ? "right" : "left");
    if (navigator.vibrate) navigator.vibrate(10);
  }
}
document.addEventListener("touchend", endSwipe);
document.addEventListener("touchcancel", endSwipe);

// ---- Tasks tab: today's TaskHub tasks (read-only), refreshed every minute
const TASKS_EVERY_MS = 60_000;
const PRIORITY = ["", "low", "medium", "high", "urgent"];
let tasksData = null, tasksByKey = {};

const day = iso => new Date(iso + "T00:00");
const fmtDay = (iso, opts = { day: "numeric", month: "short" }) => day(iso).toLocaleDateString(undefined, opts);
function dueTag(t) {
  if (t.status === "done") return `<span class="tag">done</span>`;
  const d = t.days_left;
  if (d == null) return t.start ? `<span class="tag">since ${fmtDay(t.start)}</span>` : "";
  if (d < 0) return `<span class="tag late">overdue ${-d}d</span>`;
  if (d === 0) return `<span class="tag soon">due today</span>`;
  if (d === 1) return `<span class="tag soon">due tomorrow</span>`;
  return `<span class="tag">due ${d < 7 ? fmtDay(t.due, { weekday: "short" }) : fmtDay(t.due)}</span>`;
}
function progress(t) {
  const n = t.checklist.length;
  if (!n) return "";
  const ok = t.checklist.filter(i => i.done).length;
  return `<span class="tprog">${ok}/${n}<i><b style="width:${Math.round(100 * ok / n)}%"></b></i></span>`;
}
function taskCard(t) {
  const status = { doing: "in progress", blocked: "blocked" }[t.status];
  return `<button class="task ${t.status}" data-key="${esc(t.key)}" style="--pc:${esc(t.color)}">
    <div class="ttop"><span class="tkey">${esc(t.key)}</span>
      ${t.priority ? `<span class="prio p${t.priority}">${PRIORITY[t.priority]}</span>` : ""}
      <span class="tproj">${esc(t.project)}</span></div>
    <div class="ttitle">${esc(t.title)}</div>
    <div class="tmeta">${status ? `<span class="tag ${t.status}">${status}</span>` : ""}${dueTag(t)}
      ${t.repo ? `<span>${esc(t.repo)}</span>` : ""}${progress(t)}</div>
  </button>`;
}
function renderTasks() {
  const d = tasksData;
  document.getElementById("n-tasks").textContent = d && !d.failed ? d.open || "" : "";
  if (tasksEl.hidden) return;
  if (!d) return;
  const date = day(d.today || new Date().toISOString().slice(0, 10))
    .toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" });
  const sections = (d.sections || []).filter(s => s.tasks.length);
  const scroll = tasksEl.scrollTop;
  tasksEl.innerHTML = `<div class="tbar"><h2>${esc(date)}</h2>
      <span class="hint">${d.failed ? "" : `${d.open} open · updated ${ago(d.updated)}`}</span>
      <button id="t-refresh">↻ Refresh</button></div>
    ${d.error ? `<p class="error">${esc(d.error)}</p>` : ""}
    ${d.failed ? "" : sections.length ? `<div class="tcols">${sections.map(s => `<section class="tsec ${s.id}">
        <h3>${esc(s.title)} <span class="n">${s.tasks.length}</span></h3>${s.tasks.map(taskCard).join("")}</section>`).join("")}</div>`
      : `<div class="tempty">Nothing scheduled for today.</div>`}`;
  tasksEl.scrollTop = scroll;
  document.getElementById("t-refresh").addEventListener("click", () => loadTasks(true));
}
async function loadTasks(refresh = false) {
  const btn = document.getElementById("t-refresh");
  if (btn) btn.disabled = true;
  try {
    tasksData = await call("tasks", refresh ? { refresh: 1 } : {});
  } catch (e) {
    tasksData = tasksData && !tasksData.failed ? { ...tasksData, error: e.message } : { failed: true, error: e.message };
  }
  tasksByKey = Object.fromEntries((tasksData.sections || []).flatMap(s => s.tasks).map(t => [t.key, t]));
  renderTasks();
}
tasksEl.addEventListener("click", e => {
  const t = tasksByKey[e.target.closest(".task")?.dataset.key];
  if (!t) return;
  const dates = t.start && t.due && t.start !== t.due ? `${fmtDay(t.start)} → ${fmtDay(t.due)}`
    : t.due ? `due ${fmtDay(t.due)}` : t.start ? `from ${fmtDay(t.start)}` : "no dates";
  openModal(`<h2>${esc(t.title)}</h2>
    <div class="hint"><b class="tkey">${esc(t.key)}</b> · <span style="color:${esc(t.color)}">${esc(t.project)}</span>
      ${t.repo ? ` · ${esc(t.repo)}` : ""} · ${esc(dates)}</div>
    <div class="tmeta">${{ doing: '<span class="tag doing">in progress</span>', blocked: '<span class="tag blocked">blocked</span>' }[t.status] || ""}
      ${dueTag(t)}${t.priority ? `<span class="tag prio p${t.priority}">${PRIORITY[t.priority]}</span>` : ""}
      ${t.labels.map(l => `<span class="tag">${esc(l)}</span>`).join("")}</div>
    ${t.checklist.length ? `<ul class="clist">${t.checklist.map(i =>
      `<li class="${i.done ? "ok" : ""}"><span>${i.done ? "✓" : "○"}</span><span>${esc(i.text)}</span></li>`).join("")}</ul>` : ""}
    ${t.description ? `<div class="desc">${esc(t.description)}</div>` : ""}
    <div class="actions"><button data-close>Close</button></div>`, true);
});
setInterval(() => { if (!document.hidden) loadTasks(); }, TASKS_EVERY_MS);
document.addEventListener("visibilitychange", () => { if (!document.hidden) loadTasks(); });
let startTab = "desks";
try { startTab = localStorage.getItem("kddash-tab") === "tasks" ? "tasks" : "desks"; } catch {}
if (["#tasks", "#desks"].includes(location.hash)) startTab = location.hash.slice(1);  // e.g. a bookmark to …/#tasks
showTab(startTab);
if (startTab === "desks") loadTasks();  // for the count on the Tasks tab

// Sleep: the PC turns this device's screen off over ADB (shown only where that works; see README).
const sleepBtn = document.getElementById("sleep");
if (!PANEL) call("tablet").then(r => { sleepBtn.hidden = !r.sleep; }).catch(() => {});
sleepBtn.addEventListener("click", async () => {
  sleepBtn.disabled = true;
  try {
    await call("tablet/sleep", {}, "POST");
  } catch (e) {
    openModal(`<h2>Couldn't turn the screen off</h2><p class="error">${esc(e.message)}</p>
      <div class="actions"><button data-close>Close</button></div>`);
  } finally {
    sleepBtn.disabled = false;
  }
});

// #crabs: every crab on one page, for reviewing the art. Tap to close.
function crabGallery() {
  document.querySelector(".crab-page")?.remove();
  if (location.hash !== "#crabs") return;
  const page = document.createElement("div");
  page.className = "crab-page";
  page.innerHTML = `<h2>Crabs</h2>${CRAB.gallery()}`;
  page.addEventListener("click", () => { history.replaceState(null, "", location.pathname + location.search); page.remove(); });
  document.body.append(page);
}
addEventListener("hashchange", crabGallery);
crabGallery();

connect();
</script>
</body>
</html>
